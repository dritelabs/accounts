version: '3.5'

services:
  accounts-server:
    container_name: accounts-server
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_DIR: accounts-server
        APP_NAME: '@dritelabs/accounts-server'
      # restart: on-failure
    ports:
      - 4000:4000
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://driten:driten@postgres:5432/accounts?schema=public
      MEMCACHED_HOST: memcached:11211
      AUTHORIZATION_SERVER_ISSUER_BASE_URL: http://localhost:3000
    volumes:
      - ./apps/accounts-server:/usr/src/accounts/apps/accounts-server
      - /usr/src/accounts/apps/accounts-server/node_modules/
      - /usr/src/accounts/apps/accounts-server/dist/
      - /usr/src/accounts/common/temp/node_modules/

  accounts-frontend:
    container_name: accounts-frontend
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_DIR: accounts-frontend
        APP_NAME: '@dritelabs/accounts-frontend'
      # restart: on-failure
    ports:
      - 3000:3000
      - 24678:24678
      - 24679:24679
    environment:
      NODE_ENV: development
      PORT: 3000
      SERVER_HOST: accounts-server:4000
      MEMCACHED_HOST: memcached:11211
      SECRET_COOKIE_PASSWORD: complex_password_at_least_32_characters_long
    volumes:
      - ./apps/accounts-frontend:/usr/src/accounts/apps/accounts-frontend/
      - /usr/src/accounts/apps/accounts-frontend/node_modules/
      - /usr/src/accounts/apps/accounts-frontend/.nuxt/
      - /usr/src/accounts/common/temp/node_modules/

networks:
  default:
    external:
      name: drite
