schema: ./schema.graphql
documents: ./graphql/**/*.graphql
#hooks:
#  afterOneFileWrite:
#    - eslint --fix
config:
  scalars:
    Long: number
  defaultScalarType: never
  useTypeImports: true
generates:
  graphql/operations/schema.ts:
    plugins:
      - typescript
      - typescript-urql-graphcache
  graphql/operations/:
    preset: near-operation-file
    presetConfig:
      baseTypesPath: schema.ts
      extension: .ts
    config:
      preResolveTypes: false
    plugins:
      - typescript-operations
      # - typed-document-node
      - typescript-vue-urql
  graphql/operations/introspection.ts:
    plugins:
      - urql-introspection
