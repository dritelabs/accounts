
syntax = "proto3";

package user;

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateUserResponse {
  string id = 1;
  string access_token = 2;
  string email = 3;
  int32 expires_in = 4;
  string refresh_token = 5;
  string token_type = 6;
}

message CreateUserRequest {
  string confirm_password = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string password = 5;
}

